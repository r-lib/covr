# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.s7 == 'dev' && ' S7 dev' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}
          # use 4.1 to check with rtools40's older compiler
          - {os: windows-latest, r: '4.1'}

          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          # Remove once the development S7 changes are released to CRAN
          - {os: ubuntu-latest,   r: 'release', s7: 'dev'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: ubuntu-latest,   r: 'oldrel-2'}
          - {os: ubuntu-latest,   r: 'oldrel-3'}
          - {os: ubuntu-latest,   r: 'oldrel-4'}
          # Check the minimum supported R version. Current packages (e.g.
          # testthat >= 3.3) need R >= 4.1, so use a snapshot of CRAN from before
          # they dropped R 4.0, like setup-r does for R 3.6.
          - {os: ubuntu-22.04,    r: '4.0', rspm: 'https://packagemanager.posit.co/cran/__linux__/jammy/2025-09-01'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RSPM: ${{ matrix.config.rspm }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          cran: ${{ matrix.config.rspm }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck${{ matrix.config.s7 == 'dev' && ', github::RConsortium/S7' || '' }}
          needs: check

      # Lets the tests measure the coverage of Rust code. rustup's Rust for
      # the GNU ABI of Rtools has no profiler runtime, so this isn't possible
      # on Windows.
      - name: Install Rust's llvm-tools
        if: runner.os != 'Windows'
        run: rustup component add llvm-tools

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
